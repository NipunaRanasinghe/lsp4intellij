import java.util.Calendar
import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'maven-publish'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'com.github.gradle-git-version-calculator' version '1.1.0'
    id 'net.researchgate.release' version '3.1.0'
    id 'com.vanniktech.maven.publish.base' version '0.37.0'
    id 'com.github.spotbugs' version '6.0.27'
    id 'org.sonarqube' version '6.0.1.5171'
}

group = 'io.ballerina'
version = gitVersionCalculator.calculateVersion("")

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '243'
            untilBuild = provider { null }
        }
    }

    pluginVerification {
        ides {
            recommended()
        }
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.3')
        pluginVerifier()
        testFramework(TestFrameworkType.Platform.INSTANCE)
    }

    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.23.1'
    implementation 'com.vladsch.flexmark:flexmark:0.64.8'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

tasks.named('test') {
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

license {
    header = rootProject.file('resources/license/HEADER.txt')
    ext.year = Calendar.getInstance().get(Calendar.YEAR)
    ext.author = 'WSO2 LLC. (http://www.wso2.org)'
    strictCheck = true
    skipExistingHeaders = true
    mapping('java', 'SLASHSTAR_STYLE')
    exclude '/**/*.png'
}

spotbugs {
    ignoreFailures = true
}

spotbugsMain {
    reports {
        xml.required = false
        html.required = true
    }
    def excludeFile = file('spotbugs-exclude.xml')
    if (excludeFile.exists()) {
        excludeFilter = excludeFile
    }
}

spotbugsTest {
    enabled = false
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file('config/checkstyle/checkstyle.xml')
}

checkstyleTest {
    enabled = false
}

tasks.named('check') {
    dependsOn jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacoco.xml')
        html.required = true
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

// Publish the composed (instrumented) jar instead of the base jar the 'java' component carries
publishing {
    publications {
        maven(MavenPublication) {
            from components.intellijPlatform
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')
            // The composed jar component maps every dependency to runtime scope, but these appear in public signatures
            pom.withXml {
                asNode().dependencies.dependency
                        .findAll { it.artifactId.text() in ['org.eclipse.lsp4j', 'commons-lang3'] }
                        .each { it.scope[0].value = 'compile' }
            }
        }
    }
}

// The composed jar variant declares 'composed-jar' library elements, which plain Gradle consumers cannot match; publish the POM only
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

mavenPublishing {
    publishToMavenCentral()
    // JitPack builds publish to Maven Local without a signing key
    if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
        signAllPublications()
    }
    coordinates(group.toString(), 'lsp4intellij', version.toString())

    pom {
        name = 'LSP4IntelliJ'
        description = 'Language Server Protocol (LSP) client library for IntelliJ IDEA and other JetBrains IDEs'
        url = 'https://github.com/ballerina-platform/lsp4intellij'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'ballerina-platform'
                name = 'Ballerina'
                url = 'https://ballerina.io'
            }
        }
        scm {
            url = 'https://github.com/ballerina-platform/lsp4intellij'
            connection = 'scm:git:https://github.com/ballerina-platform/lsp4intellij.git'
            developerConnection = 'scm:git:ssh://git@github.com/ballerina-platform/lsp4intellij.git'
        }
    }
}

sonarqube {
    properties {
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.organization', 'ballerina-platform'
        property 'sonar.projectKey', 'ballerina-platform_lsp4intellij'
        property 'sonar.projectName', 'LSP4IntelliJ'
        property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/test/jacoco.xml').get().asFile.path
    }
}

release {
    failOnCommitNeeded = true
    failOnPublishNeeded = true
    failOnSnapshotDependencies = true
    failOnUnversionedFiles = true
    failOnUpdateNeeded = true
    revertOnFail = true
    preCommitText = ''
    preTagCommitMessage = '[Gradle Release Plugin] - pre tag commit: '
    tagCommitMessage = '[Gradle Release Plugin] - creating tag: '
    newVersionCommitMessage = '[Gradle Release Plugin] - new version commit: '
    tagTemplate = '$version'
    versionPropertyFile = 'gradle.properties'
    buildTasks = ['jar']

    git {
        requireBranch.set('release-stage')
        pushToRemote.set('upstream')
        commitVersionFileOnly.set(false)
        signTag.set(false)
    }
}
